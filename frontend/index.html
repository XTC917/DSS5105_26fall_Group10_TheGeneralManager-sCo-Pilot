<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweaterCo — GM Co-Pilot</title>
    <script>
      // Apply the persisted colour theme before first paint to avoid a flash (FOUC).
      // Seven independent themes (Ocean / Lavender / Sage / Rose / Amber / Slate /
      // Black). No Light / Dark / System. Migrates the old accent-only choice.
      (function () {
        try {
          var ids = ["ocean", "lavender", "sage", "rose", "amber", "slate", "black"];
          var root = document.documentElement;
          var stored = localStorage.getItem("sweaterco.theme");
          var legacy = localStorage.getItem("sweaterco.theme.accent");
          var theme = ids.indexOf(stored) >= 0 ? stored : ids.indexOf(legacy) >= 0 ? legacy : "ocean";
          root.dataset.theme = theme;
          root.dataset.accent = theme;
          root.dataset.appearance = theme === "black" ? "dark" : "light";
        } catch (e) {
          /* ignore — defaults from tokens.css apply */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
