# Semantic layer
#
# data_definition — every stored table/column, including field descriptions.
# term_definition — special vocabulary only (not a second copy of each column).
# Add more terms later; do not duplicate column names here unless they are jargon
# (e.g. OVERDUE, selling price) that is not itself a stored column.
# Table and column keys are the logical names used in the database.
# Keep each table self-contained: do not point at another table's columns
# (progressive disclosure may load one table at a time).

version: 1

data_definition:
  tables:
    orders:
      grain: One row is one customer order.
      description: >
        Who ordered what, how many pieces, due when, and current stage.
        Each row is one order's piece count, not factory output. Do not add
        orders.pieces (or count orders) to answer factory-wide or daily
        production questions. Those totals are not equal to production_log
        and must not be used as a substitute for it.
      columns:
        order_id:
          type: string
          nullable: false
          allowed_values: null
          description: Order identifier, ORD-001 … ORD-120.
        customer:
          type: string
          nullable: false
          allowed_values:
            - UrbanThread
            - TrendCart
            - Cotton Club
            - Harbor Knits
            - Bright Basics
            - Loom & Leaf
            - Maple & Co
            - Northwind Apparel
          description: >
            Brand customer who placed the factory order. Not an outside
            workshop name (those live on workshops.name).
        product:
          type: string
          nullable: false
          allowed_values:
            - Cardigan
            - Crewneck sweater
            - Scarf
            - Hoodie
            - Polo shirt
            - Vest
            - Beanie
          description: What was ordered (garment type on the order row).
        category:
          type: string
          nullable: false
          allowed_values:
            - TOPS
            - ACCESSORIES
          description: TOPS (sweaters, hoodies, …) or ACCESSORIES (beanies, scarves).
        pieces:
          type: integer
          nullable: false
          allowed_values: null
          description: How many garments in this order.
        order_date:
          type: date
          nullable: false
          allowed_values: null
          description: When the order was placed.
        due_date:
          type: date
          nullable: false
          allowed_values: null
          description: When the order is due.
        status:
          type: string
          nullable: false
          allowed_values:
            - COMPLETE
            - IN_PROGRESS
          description: COMPLETE or IN_PROGRESS.
        current_stage:
          type: string
          nullable: false
          allowed_values:
            - ORDERED
            - KNITTING
            - ASSEMBLY
            - WASHING
            - PACKING
            - COMPLETE
          description: Current lifecycle stage of the order. ORDERED means the order
                       has been placed but has not started knitting. Production proceeds
                       through KNITTING → ASSEMBLY → WASHING → PACKING, followed by COMPLETE.
        last_activity_date:
          type: date
          nullable: false
          allowed_values: null
          description: Date the order entered its current stage. For ORDERED rows, it is the order date.
        completed_date:
          type: date
          nullable: true
          allowed_values: null
          description: When it finished; blank if still in progress.
        days_late:
          type: integer
          nullable: true
          allowed_values: null
          description: completed_date minus due_date; negative means early; blank if in progress.

    production_log:
      grain: One row is one stage on one calendar day (factory-wide).
      description: >
        Daily factory output by stage. Factory-wide totals, not attributed
        to a single order. This is the source for macroscopic production
        questions (how much the factory produced on a day or at a stage).
        Do not reconstruct these totals by summing orders.pieces: order
        size and factory output are different grains and do not add up to
        the same number.
      columns:
        date:
          type: date
          nullable: false
          allowed_values: null
          description: The calendar day.
        stage:
          type: string
          nullable: false
          allowed_values:
            - KNITTING
            - ASSEMBLY
            - WASHING
            - PACKING
          description: Which of the four factory stages this daily total belongs to.
        pieces_completed:
          type: integer
          nullable: false
          allowed_values: null
          description: Garments finished at that stage that day.

    workshops:
      grain: One row is one workshop–category pair. Not a log of past jobs.
      description: >
        Eight subcontract shops SweaterCo can send extra work to when the
        factory is full (eight shops, eight rows). 
        Used only by check_feasibility (can we take a new order by a date?).
        There is no record here of which orders were actually sent out.
      columns:
        workshop_id:
          type: string
          nullable: false
          allowed_values:
            - W1
            - W2
            - W3
            - W4
            - W5
            - W6
            - W7
            - W8
          description: Stable id, W1–W8. Use this in traces, not the nickname.
        name:
          type: string
          nullable: false
          allowed_values:
            - QuickStitch
            - SteadyHands
            - BudgetWorks
            - Little Loom
            - GiantWeave
            - Nimble Needle
            - OldMill
            - FreshStart
          description: >
            Display name of an outside subcontract shop. Same workshop as
            workshop_id. Not an orders.customer.
        capacity_pieces_per_day:
          type: number
          nullable: false
          allowed_values: null
          description: >
            How many garments this shop can finish in one working day if it
            is free (W1=300, W4=70). Repeated on every category row for the
            same workshop_id; do not add those rows together. Feasibility
            multiplies this by usable days. It is not the factory's own
            in-house throughput.
        pickup_lead_days:
          type: number
          nullable: false
          allowed_values: null
          description: >
            Days lost to send work there and get it back (transport), charged
            once per new batch in the MVP. Example: due in 10 working days
            and lead=4 means only 6 days are left before subtracting their
            existing queue. Not the same as current_queue_days.
        defect_rate:
          type: number
          nullable: false
          allowed_values: null
          description: >
            Fraction of pieces expected to fail and be redone (0.12 = 12%).
            Feasibility keeps only (1 − defect_rate) of daily capacity.
            Not a count of past defective batches.
        cost_per_piece:
          type: number
          nullable: false
          allowed_values: null
          description: >
            What we pay this shop per garment they make for us. Not what
            the brand customer pays us. Cannot answer revenue or selling
            price. MVP feasibility does not use this number in the verdict.
        makes:
          type: string
          nullable: false
          allowed_values:
            - TOPS
            - ACCESSORIES
          description: >
            Product family this row’s machines can make. TOPS = sweaters
            / hoodies / vests etc.; ACCESSORIES = beanies / scarves.
            This is shop equipment, not an
            orders.category label.
        status:
          type: string
          nullable: false
          allowed_values:
            - ACTIVE
            - SUSPENDED
          description: >
            ACTIVE = allowed to take new work. SUSPENDED = failed a quality
            audit; check_feasibility ignores it (W7 OldMill).
        max_batch_pieces:
          type: number
          nullable: true
          allowed_values: null
          description: >
            Max garments in one new batch we may send. Blank/null = no cap.
            Only W8 FreshStart has 300 (trial shop). Feasibility then takes
            min(estimated output, this cap). Not daily capacity.
        current_queue_days:
          type: number
          nullable: false
          allowed_values: null
          description: >
            How many working days of work they already have booked as of
            factory today (2026-04-01), before they could start our new
            batch. 0 = idle; 5 = five days of backlog. Subtracted from the
            due-date window together with pickup_lead_days. Shop-level
            backlog; repeated on each category row for the same workshop_id.
            Not a live queue table.
        notes:
          type: string
          nullable: true
          allowed_values: null
          description: >
            Dispatcher one-liner (fast, cheap, sloppy, …). Qualitative only.
            Do not treat it as a hidden number or as permission to invent
            capacity.

    snapshot:
      grain: One row is one order entering one lifecycle stage (an event, not a daily snapshot).
      description: >
        Derived stage-event table for historical as-of reconstruction.
        One order may have several rows as it moves ORDERED → KNITTING →
        ASSEMBLY → WASHING → PACKING → COMPLETE. To read the order on
        calendar day D, take that order_id's latest row whose date is still ≤ D.
      columns:
        order_id:
          type: string
          nullable: false
          allowed_values: null
          description: Order identifier, ORD-001 … ORD-120.
        status:
          type: string
          nullable: false
          allowed_values:
            - COMPLETE
            - IN_PROGRESS
          description: >
            Order status at this event. IN_PROGRESS until the order finishes;
            COMPLETE only on the completion event.
        stage:
          type: string
          nullable: false
          allowed_values:
            - ORDERED
            - KNITTING
            - ASSEMBLY
            - WASHING
            - PACKING
            - COMPLETE
          description: >
            Lifecycle stage this event entered. ORDERED = placed but not yet
            knitting. Then KNITTING → ASSEMBLY → WASHING → PACKING, then COMPLETE.
        date:
          type: date
          nullable: false
          allowed_values: null
          description: >
            Date the order entered this stage. For ORDERED, this is the order
            date. For COMPLETE, this is the completed date. For production
            stages, this is the reconstructed stage-start date.

term_definition:
  # Special vocabulary only. Copy this shape when adding jargon.
  terms:
    factory_today:
      description: Business clock is 2026-04-01. Do not use the computer date.
    selling_price:
      in_dataset: false
      description: Not a stored field. What we pay an outside shop per garment is not a selling price.
    overdue:
      tool: get_orders_at_risk
      description: >
        Same manager wording as due date, miss due date, likely to miss
        due dates. stored=true. table=orders, column=due_date.
        The CSV stores due_date; overdue / pace-miss are Python flags on
        that date, not missing data.
    prioritize:
      tool: discover_factory_issues
      description: >
        Same manager wording as priority, what to prioritize today, and
        today's production priority. ** It is NOT an action **. kind != action, stored=true. table=orders,
        column=due_date. Ranking is a Python grouping on stored order
        dates and stages, not missing data.
    unusual_production:
      tool: discover_factory_issues
      description: >
        Same manager wording as unusual production issues, production
        bottleneck, stage output vs 30-day median, and "any unusual
        production issues I should know about today". kind=fact, not
        action. stored=true. table=production_log, column=pieces_completed.
        Queue counts use orders.current_stage. This is factory-wide
        production, not the order-priority list.
    feasibility:
      tool: check_feasibility
      description: >
        Same manager wording as can we take, could we accept, take N
        hoodies/cardigans/accessories by a date, and accept a new order
        for delivery by. ** It is NOT an action **. kind=fact, stored=true.
        table=workshops, column=capacity_pieces_per_day. The verdict is a
        Python estimate on stored workshop capacity, IN_PROGRESS pieces,
        and 30-day stage medians — not missing data.
